name: Daily Shazam spike tracker

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shazam-daily
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch Top 200 chart and detect spikes
        run: python3 shazam_tracker.py
      - name: Build label digests
        run: python3 bridge.py
      - name: Validate and archive Discovery chart
        run: python3 discovery_tracker.py
      - name: Commit all daily results together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/ spikes.json digests/
          if ! git diff --cached --quiet; then
            git commit -m "Update daily Shazam and Discovery charts"
            git push origin HEAD:main
          fi
